# Runs the type-check and the tests on every push and pull request.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read # the tests never need to write to the repo
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test